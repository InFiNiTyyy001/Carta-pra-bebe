<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Uma carta para minha princesinha</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    overflow: hidden;
    background:
      radial-gradient(circle at 50% 35%, #4a3024 0%, #241812 55%, #100b09 100%);
    font-family: Georgia, "Times New Roman", serif;
    color: #3b2115;
  }

  .scene {
    width: min(92vw, 430px);
    height: min(88vh, 650px);
    display: grid;
    place-items: center;
    perspective: 1200px;
  }

  .hint {
    position: absolute;
    bottom: 8vh;
    color: #e9d3a6;
    font-size: 14px;
    letter-spacing: .5px;
    opacity: .9;
    animation: pulse 1.8s infinite;
  }

  .envelope {
    position: relative;
    width: min(86vw, 390px);
    height: 270px;
    cursor: pointer;
    transform-style: preserve-3d;
    transition: transform .6s ease;
    filter: drop-shadow(0 20px 25px rgba(0,0,0,.45));
  }

  .paper {
    position: absolute;
    inset: 0;
    background: #d8bd88;
    border: 2px solid #9b713d;
    border-radius: 5px;
  }

  .paper::before {
    content: "";
    position: absolute;
    inset: 9px;
    border: 1px solid rgba(92,55,23,.55);
    pointer-events: none;
  }

  .back {
    background: linear-gradient(145deg, #d6ba83, #b9955d);
  }

  .flap {
    position: absolute;
    z-index: 4;
    left: 0;
    top: 0;
    width: 100%;
    height: 62%;
    background: #caa86d;
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    transform-origin: top center;
    transition: transform 1s cubic-bezier(.2,.75,.2,1), z-index 0s 0s;
    backface-visibility: hidden;
  }

  .flap::after {
    content: "✦";
    position: absolute;
    left: 50%;
    top: 38%;
    transform: translate(-50%,-50%);
    font-size: 30px;
    color: #6e3c23;
  }

  .seal {
    position: absolute;
    z-index: 5;
    left: 50%;
    top: 49%;
    transform: translate(-50%,-50%);
    width: 62px;
    height: 62px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: radial-gradient(circle at 35% 30%, #b54b43, #641d1c 70%);
    color: #f1d8a8;
    border: 3px solid #451413;
    box-shadow: 0 5px 10px rgba(0,0,0,.35);
    transition: transform .45s ease, opacity .3s ease;
    font-size: 25px;
  }

  .letter {
    position: absolute;
    z-index: 2;
    left: 5%;
    right: 5%;
    top: 8%;
    height: 84%;
    padding: 38px 25px 25px;
    overflow: hidden;
    background:
      radial-gradient(circle at 20% 20%, rgba(110,70,30,.12), transparent 30%),
      linear-gradient(#ead7ad, #d9bc83);
    border: 1px solid #a17a47;
    box-shadow: 0 5px 12px rgba(0,0,0,.2);
    transform: translateY(18%);
    opacity: 0;
    transition: transform 1.1s cubic-bezier(.2,.8,.2,1), opacity .55s ease;
  }

  .letter h1 {
    margin: 0 0 18px;
    text-align: center;
    font-size: 22px;
    font-style: italic;
    color: #51291c;
  }

  .letter p {
    margin: 0 auto 14px;
    max-width: 320px;
    font-size: 17px;
    line-height: 1.55;
    text-align: center;
  }

  .signature {
    margin-top: 18px !important;
    font-style: italic;
  }

  .corner {
    position: absolute;
    color: #704326;
    font-size: 20px;
  }
  .c1 { top: 12px; left: 15px; }
  .c2 { top: 12px; right: 15px; }
  .c3 { bottom: 10px; left: 15px; }
  .c4 { bottom: 10px; right: 15px; }

  .open .flap {
    transform: rotateX(180deg);
    z-index: 1;
  }

  .open .seal {
    transform: translate(-50%,-50%) scale(.2) rotate(30deg);
    opacity: 0;
  }

  .open .letter {
    transform: translateY(-19%);
    opacity: 1;
  }

  .open {
    transform: translateY(8px);
  }

  .open .hint { display: none; }

  @keyframes pulse {
    0%,100% { opacity: .55; }
    50% { opacity: 1; }
  }

  .tear {
    position: absolute;
    z-index: 10;
    top: 0;
    left: 50%;
    width: 0;
    height: 100%;
    pointer-events: none;
    border-left: 2px dashed rgba(78,42,22,.65);
    opacity: 0;
  }

  .open .tear {
    animation: tear .55s ease forwards;
  }

  @keyframes tear {
    0% { opacity: 0; transform: scaleY(.1); }
    40% { opacity: 1; transform: scaleY(.7); }
    100% { opacity: 0; transform: scaleY(1.2); }
  }

  @media (max-height: 650px) {
    .envelope { transform: scale(.82); }
    .open { transform: scale(.82) translateY(8px); }
  }
</style>
</head>
<body>
  <div class="scene">
    <div class="envelope" id="envelope" role="button" tabindex="0" aria-label="Abrir carta">
      <div class="paper back"></div>

      <div class="letter">
        <span class="corner c1">✦</span>
        <span class="corner c2">❧</span>
        <span class="corner c3">❧</span>
        <span class="corner c4">✦</span>

        <h1>À minha princesinha bravinha ❤️</h1>

        <p>
          Há algo que vosso bebezinho precisa confessar:
          <strong>eu vos amo.</strong>
        </p>

        <p>
          E, por mais bravinha que sejais às vezes,
          ainda sois a princesa que mora em meu coração.
        </p>

        <p class="signature">
          Com amor,<br>
          vosso bebezinho. ♡
        </p>
      </div>

      <div class="flap"></div>
      <div class="seal">♛</div>
      <div class="tear"></div>
    </div>

    <div class="hint">Toque na carta para abri-la ✦</div>
  </div>

<script>
  const envelope = document.getElementById("envelope");

  function openLetter() {
    envelope.classList.add("open");
  }

  envelope.addEventListener("click", openLetter);
  envelope.addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      openLetter();
    }
  });
</script>
</body>
</html>
